<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DocHub – Document Management System</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
:root{--bg:#f6f5f1;--surface:#ffffff;--surface-1:#f3f2ee;--border:rgba(0,0,0,.12);--border-strong:rgba(0,0,0,.22);--text:#1f1e1d;--text-2:#5f5e5a;--muted:#8a8984;--accent:#185FA5;--accent-bg:#E6F1FB;--warn:#854F0B;--warn-bg:#FAEEDA;--danger:#A32D2D;--danger-bg:#FCEBEB;--radius:8px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--surface);font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--text);font-size:14px}
button{font:inherit;font-size:13px;padding:7px 12px;border-radius:var(--radius);border:1px solid var(--border-strong);background:var(--surface);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button:hover{background:var(--surface-1)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
input,select,textarea{font:inherit;font-size:13px;padding:7px 10px;border-radius:var(--radius);border:1px solid var(--border-strong);background:var(--surface);color:var(--text)}
textarea{resize:vertical}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);width:100vw;height:100vh}
.side{background:var(--surface-1);padding:20px 12px;border-right:1px solid var(--border);height:100vh;overflow-y:auto}
.logo{display:flex;align-items:center;gap:8px;padding:4px 8px 18px;font-weight:600;font-size:17px}
.nav{display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--radius);cursor:pointer;color:var(--text-2)}
.nav:hover{background:rgba(0,0,0,.04)}.nav.on{background:rgba(0,0,0,.08);color:var(--text)}
.main{padding:28px 40px;height:100vh;overflow-y:auto}
.row{display:grid;grid-template-columns:26px minmax(0,1fr) 130px 110px;gap:10px;align-items:center;padding:11px 8px;border-bottom:1px solid var(--border);cursor:pointer}
.row:hover{background:var(--surface-1)}
.b{font-size:11px;padding:3px 9px;border-radius:var(--radius);display:inline-block}
.Draft{background:var(--surface-1);color:var(--text-2);border:1px solid var(--border)}
.Submitted{background:var(--accent-bg);color:var(--accent)}
.Amended{background:var(--warn-bg);color:var(--warn)}
.Cancelled{background:var(--danger-bg);color:var(--danger)}
.chip{font-size:12px;padding:5px 11px;border-radius:var(--radius);border:1px solid var(--border);cursor:pointer;color:var(--text-2);display:inline-flex;align-items:center;gap:4px}
.chip.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.card{border:1px solid var(--border);border-radius:12px;padding:14px}
.muted{color:var(--text-2);font-size:12px}
.err{font-size:13px;color:var(--danger)}
</style>
</head>
<body>
<div class="app">
<div class="side">
<div class="logo"><i class="ti ti-folders" style="font-size:22px;color:var(--accent)"></i>DocHub</div>
<select id="proj" style="width:100%;margin-bottom:12px"><option>Tower A – Phase 1</option><option>Mall Expansion</option><option>Villa Compound</option></select>
<div class="nav on" data-v="files"><i class="ti ti-folder"></i>Files</div>
<div class="nav" data-v="starred"><i class="ti ti-star"></i>Starred</div>
<div class="nav" data-v="reviews"><i class="ti ti-message-check"></i>Reviews <span id="rc" class="b Submitted" style="margin-left:auto">3</span></div>
<div class="nav" data-v="users"><i class="ti ti-users"></i>Users</div>
<div class="nav" data-v="activity"><i class="ti ti-history"></i>Activity</div>
<div class="nav" data-v="storage"><i class="ti ti-server"></i>Storage</div>
</div>
<div class="main" id="main"></div>
</div>
<script>
const S={view:'files',folder:'All',filter:'All',file:null,share:false,q:'',
folders:['Architectural','Structural','MEP','Contracts'],
files:[
{id:1,n:'A-101 Ground floor plan.dwg',f:'Architectural',s:'Submitted',v:3,star:true,by:'Sara M.',d:'22 Oct',rev:'Pending'},
{id:2,n:'A-205 Facade elevations.pdf',f:'Architectural',s:'Amended',v:2,star:false,by:'Omar K.',d:'21 Oct',rev:'Revise'},
{id:3,n:'S-010 Foundation details.pdf',f:'Structural',s:'Draft',v:1,star:false,by:'Hany A.',d:'20 Oct',rev:'-'},
{id:4,n:'M-301 HVAC layout.dwg',f:'MEP',s:'Submitted',v:1,star:true,by:'Lina R.',d:'19 Oct',rev:'Pending'},
{id:5,n:'Main contract rev B.docx',f:'Contracts',s:'Cancelled',v:2,star:false,by:'Admin',d:'15 Oct',rev:'-'},
{id:6,n:'S-022 Column schedule.xlsx',f:'Structural',s:'Submitted',v:2,star:false,by:'Hany A.',d:'18 Oct',rev:'Approved'}],
comments:{1:[{u:'Eng. Tarek (Consultant)',ext:true,t:"Stair core width doesn't match structural. Please check grid C.",d:'22 Oct'},{u:'Sara M.',t:'@Tarek updated in v3, please confirm.',d:'23 Oct'}],2:[{u:'Client rep',ext:true,t:'Use the lighter cladding option from the mood board.',d:'21 Oct'}]},
users:[{n:'Sara M.',r:'Project admin',e:'Internal'},{n:'Omar K.',r:'Author',e:'Internal'},{n:'Hany A.',r:'Author',e:'Internal'},{n:'Eng. Tarek',r:'Reviewer',e:'External · expires 30 Nov'},{n:'Client rep',r:'Comment + download',e:'External · expires 15 Dec'}],
log:[['Sara M.','uploaded v3 of A-101 Ground floor plan','23 Oct 10:12'],['Sara M.','notified Eng. Tarek to confirm A-101','23 Oct 10:13'],['Eng. Tarek','commented on A-101','22 Oct 16:40'],['Omar K.','changed A-205 status to Amended','21 Oct 12:05'],['Admin','cancelled Main contract rev B','15 Oct 09:30']]};
const $=id=>document.getElementById(id);
const badge=s=>`<span class="b ${s}">${s}</span>`;
const log=a=>S.log.unshift(['You',a,'Just now']);
function toolbar(){return `<div style="display:flex;gap:8px;align-items:center;margin-bottom:14px"><input id="q" placeholder="Search files" style="flex:1"><button id="up" class="primary"><i class="ti ti-upload"></i> Upload</button><button id="nf"><i class="ti ti-folder-plus"></i> New folder</button></div>`}
function fileRows(list){return list.map(f=>`<div class="row" data-f="${f.id}"><i class="ti ti-star" data-star="${f.id}" style="font-size:18px;color:${f.star?'#BA7517':'var(--muted)'}"></i><div style="min-width:0"><div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${f.n}</div><div class="muted">${f.f} · v${f.v} · ${f.by} · ${f.d}</div></div><div>${badge(f.s)}</div><div class="muted">${f.rev}</div></div>`).join('')||'<div class="muted" style="padding:24px 0">Drop files here or use Upload to add the first document.</div>'}
function vFiles(starOnly){
let list=S.files.filter(f=>(S.folder==='All'||f.f===S.folder)&&(S.filter==='All'||f.s===S.filter)&&(!starOnly||f.star));
if(S.q)list=list.filter(f=>f.n.toLowerCase().includes(S.q.toLowerCase()));
return toolbar()+(starOnly?'':`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">${['All',...S.folders].map(x=>`<span class="chip ${S.folder===x?'on':''}" data-fo="${x}"><i class="ti ti-folder"></i> ${x}</span>`).join('')}</div>`)+
`<div style="display:flex;gap:6px;margin-bottom:10px;align-items:center;flex-wrap:wrap"><span class="muted">Status</span>${['All','Draft','Submitted','Amended','Cancelled'].map(x=>`<span class="chip ${S.filter===x?'on':''}" data-st="${x}">${x}</span>`).join('')}</div>
<div class="row muted" style="cursor:default;background:none"><span></span><span>Name</span><span>Status</span><span>Review</span></div>`+fileRows(list)}
function vFile(){const f=S.files.find(x=>x.id===S.file),c=S.comments[f.id]||[];
return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><button id="back"><i class="ti ti-arrow-left"></i></button><div style="flex:1;min-width:0"><div style="font-weight:500;font-size:16px">${f.n}</div><div class="muted">${f.f} · version ${f.v} · ${badge(f.s)}</div></div><button id="sh"><i class="ti ti-share"></i> Share</button></div>
${S.share?vShare(f):''}
<div style="display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px">
<div><div style="height:380px;border-radius:var(--radius);background:var(--surface-1);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:8px"><i class="ti ti-file-text" style="font-size:36px"></i><span>In-browser preview and markup</span></div>
<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><select id="stc" style="flex:1">${['Draft','Submitted','Amended','Cancelled'].map(s=>`<option ${s===f.s?'selected':''}>${s}</option>`).join('')}</select><button id="rv"><i class="ti ti-upload"></i> Upload revision</button><button><i class="ti ti-download"></i> Download</button></div>
<div class="muted" style="margin-top:14px;font-weight:500">Versions</div>${Array.from({length:f.v},(_,i)=>`<div class="muted" style="padding:6px 0;border-bottom:1px solid var(--border)">v${f.v-i}${i===0?' (current)':''} · ${f.by}</div>`).join('')}
<div style="display:flex;gap:8px;margin-top:14px"><button id="ap"><i class="ti ti-check"></i> Approve</button><button id="rj"><i class="ti ti-arrow-back-up"></i> Revise and resubmit</button></div></div>
<div class="card"><div style="font-weight:500;margin-bottom:10px">Comments (${c.length})</div>${c.map(x=>`<div style="padding:8px 0;border-bottom:1px solid var(--border)"><div style="font-size:12px">${x.u} ${x.ext?'<span class="b Amended">External</span>':''} <span class="muted">${x.d}</span></div><div style="margin-top:2px">${x.t.replace(/@\w+/g,m=>`<span style="color:var(--accent)">${m}</span>`)}</div></div>`).join('')||'<div class="muted">Start the review by leaving the first comment.</div>'}
<textarea id="ct" rows="3" placeholder="Add feedback, @mention a teammate" style="width:100%;margin-top:10px"></textarea><div id="ce" class="err"></div>
<div style="display:flex;gap:8px;margin-top:6px"><button><i class="ti ti-paperclip"></i></button><button id="pc" class="primary" style="flex:1;justify-content:center">Post comment</button></div></div></div>`}
function vShare(f){return `<div class="card" style="margin-bottom:14px;background:var(--surface-1)"><div style="font-weight:500;margin-bottom:10px">Share "${f.n}"</div>
<div style="display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap"><input id="em" placeholder="name@consultant.com" style="flex:1;min-width:180px"><select id="pl"><option>View</option><option>Comment</option><option>Download</option><option>Edit</option></select><input id="ex" type="date" title="Access expiry"><button id="inv" class="primary">Invite</button></div><div id="ee" class="err"></div>
<label class="muted" style="display:flex;gap:6px;align-items:center;margin:8px 0"><input type="checkbox"> Share with the entire organization</label>
${S.users.map(u=>`<div style="display:flex;justify-content:space-between;padding:5px 0" class="muted"><span style="color:var(--text)">${u.n}</span><span>${u.r}</span></div>`).join('')}</div>`}
function vReviews(){const p=S.files.filter(f=>f.rev==='Pending'||f.rev==='Revise');
return `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px">${[['Awaiting review',S.files.filter(f=>f.rev==='Pending').length],['Needs revision',S.files.filter(f=>f.rev==='Revise').length],['Approved',S.files.filter(f=>f.rev==='Approved').length]].map(m=>`<div style="background:var(--surface-1);border-radius:var(--radius);padding:16px"><div class="muted">${m[0]}</div><div style="font-size:28px;font-weight:500">${m[1]}</div></div>`).join('')}</div>`+fileRows(p)}
function vUsers(){return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><span style="font-weight:500;font-size:16px">Team and external users</span><button id="ae" class="primary"><i class="ti ti-user-plus"></i> Add external user</button></div>`+S.users.map(u=>{const ext=u.e.startsWith('Ext');return `<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)"><div style="width:34px;height:34px;border-radius:50%;background:${ext?'var(--warn-bg)':'var(--accent-bg)'};color:${ext?'var(--warn)':'var(--accent)'};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500">${u.n.split(' ').map(w=>w[0]).join('').slice(0,2)}</div><div style="flex:1"><div>${u.n}</div><div class="muted">${u.e}</div></div><span class="muted">${u.r}</span></div>`}).join('')}
function vActivity(){return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><span style="font-weight:500;font-size:16px">Activity log</span><button><i class="ti ti-file-export"></i> Export</button></div>`+S.log.map(l=>`<div style="display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)"><i class="ti ti-point" style="color:var(--accent)"></i><div style="flex:1"><b style="font-weight:500">${l[0]}</b> ${l[1]}</div><span class="muted">${l[2]}</span></div>`).join('')}
function vStorage(){return `<div style="font-weight:500;font-size:16px;margin-bottom:12px">Storage under your organization's control</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">${[['ti-server','On-premise server','Local data center'],['ti-cloud','Private cloud','Your own Azure / AWS account']].map((o,i)=>`<div class="card" style="${i===1?'border:2px solid var(--accent)':''}"><i class="ti ${o[0]}" style="font-size:24px"></i><div style="font-weight:500;margin-top:8px">${o[1]}</div><div class="muted">${o[2]}</div></div>`).join('')}</div>
<div class="muted" style="margin-top:18px">Used 412 GB of 2 TB</div><div style="height:8px;background:var(--surface-1);border-radius:4px;margin-top:6px"><div style="width:21%;height:8px;background:var(--accent);border-radius:4px"></div></div><div class="muted" style="margin-top:12px">Last backup: today 02:00 · encrypted at rest</div>`}
function render(){const m=$('main');
m.innerHTML=S.file?vFile():S.view==='files'?vFiles():S.view==='starred'?vFiles(true):S.view==='reviews'?vReviews():S.view==='users'?vUsers():S.view==='activity'?vActivity():vStorage();
$('rc').textContent=S.files.filter(f=>f.rev==='Pending'||f.rev==='Revise').length;
const q=$('q');if(q){q.value=S.q;q.oninput=e=>{S.q=e.target.value;render();const n=$('q');n.focus();n.setSelectionRange(n.value.length,n.value.length)}}
m.querySelectorAll('[data-star]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();const f=S.files.find(x=>x.id==e.dataset.star);f.star=!f.star;render()});
m.querySelectorAll('[data-f]').forEach(e=>e.onclick=()=>{S.file=+e.dataset.f;S.share=false;render()});
m.querySelectorAll('[data-fo]').forEach(e=>e.onclick=()=>{S.folder=e.dataset.fo;render()});
m.querySelectorAll('[data-st]').forEach(e=>e.onclick=()=>{S.filter=e.dataset.st;render()});
if($('up'))$('up').onclick=()=>{const n=prompt('File name','A-110 First floor plan.pdf');if(n){S.files.unshift({id:Date.now(),n,f:S.folder==='All'?'Architectural':S.folder,s:'Draft',v:1,star:false,by:'You',d:'Today',rev:'-'});log('uploaded '+n);render()}};
if($('nf'))$('nf').onclick=()=>{const n=prompt('Folder name','Landscape');if(n){S.folders.push(n);log('created folder '+n);render()}};
if($('ae'))$('ae').onclick=()=>{const n=prompt('External user name','Eng. Nadia (QS)');if(n){S.users.push({n,r:'Comment',e:'External · expires 31 Dec'});log('invited external user '+n);render()}};
const f=S.file&&S.files.find(x=>x.id===S.file);if(!f)return;
$('back').onclick=()=>{S.file=null;render()};
$('sh').onclick=()=>{S.share=!S.share;render()};
$('stc').onchange=e=>{f.s=e.target.value;log(`changed ${f.n} status to ${f.s}`);render()};
$('rv').onclick=()=>{f.v++;f.s='Amended';f.rev='Pending';f.d='Today';log(`uploaded v${f.v} of ${f.n} and notified reviewers`);(S.comments[f.id]=S.comments[f.id]||[]).push({u:'System',t:`Version ${f.v} uploaded. Reviewers notified to check and confirm.`,d:'Now'});render()};
$('ap').onclick=()=>{f.rev='Approved';log('approved '+f.n);render()};
$('rj').onclick=()=>{f.rev='Revise';log('requested revision on '+f.n);render()};
$('ct').oninput=()=>$('ce').textContent='';
$('pc').onclick=()=>{const t=$('ct').value.trim();if(!t){$('ce').textContent='Write a comment first';return}(S.comments[f.id]=S.comments[f.id]||[]).push({u:'You',t,d:'Now'});log('commented on '+f.n);render()};
if($('inv')){$('em').oninput=()=>$('ee').textContent='';$('inv').onclick=()=>{const e=$('em').value.trim();if(!/^\S+@\S+\.\S+$/.test(e)){$('ee').textContent='Enter a valid email address';return}S.users.push({n:e,r:$('pl').value,e:'External · '+($('ex').value?'expires '+$('ex').value:'no expiry')});log(`shared ${f.n} with ${e} (${$('pl').value})`);render()}}}
document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('on'));n.classList.add('on');S.view=n.dataset.v;S.file=null;render()});
render();
</script>
</body>
</html>
